<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Panel privado — Gastón Lucero</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Jost:wght@300;400;500;600&display=swap');

:root{
  --bg-deep:#1B140F;
  --bg-card:#241B15;
  --bg-card-2:#2D2318;
  --gold:#C6A15B;
  --gold-soft:#E4C98A;
  --gold-dark:#8C6C33;
  --cream:#F3EAD9;
  --muted:#A99B85;
  --line:rgba(198,161,91,0.28);
  --line-soft:rgba(198,161,91,0.14);
  --danger:#C6685A;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg-deep);
  color:var(--cream);
  font-family:'Jost',sans-serif;
  font-weight:300;
}
h1,h2,h3,.serif{font-family:'Fraunces',serif;}
a{color:var(--gold-soft); text-decoration:none;}
.eyebrow{
  font-family:'Jost',sans-serif;
  letter-spacing:.22em;
  text-transform:uppercase;
  font-size:11px;
  color:var(--gold);
  font-weight:500;
}
.site-header{
  display:flex; justify-content:space-between; align-items:center;
  padding:26px 48px; border-bottom:1px solid var(--line-soft);
}
.brand{font-family:'Fraunces',serif; font-size:22px; letter-spacing:.04em;}
.brand span{color:var(--gold);}
.site-nav{display:flex; gap:36px; font-size:13px; letter-spacing:.05em; color:var(--muted);}
.btn{
  font-family:'Jost',sans-serif; font-size:12px; letter-spacing:.12em; text-transform:uppercase;
  padding:13px 28px; border:1px solid var(--gold-dark); background:transparent;
  color:var(--gold-soft); cursor:pointer; transition:.2s;
}
.btn:hover{background:var(--gold); color:var(--bg-deep); border-color:var(--gold);}
.btn.solid{background:var(--gold); color:var(--bg-deep);}
.btn.solid:hover{background:var(--gold-soft);}
.btn:disabled{opacity:.4; cursor:not-allowed;}
.section-pad{padding:60px 64px;}
.section-head{max-width:520px; margin-bottom:40px;}
.section-head h2{font-size:30px; font-weight:400; margin:14px 0 0;}

.services-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:1px; background:var(--line-soft); border:1px solid var(--line-soft);}
.service-card{background:var(--bg-deep); padding:28px 32px; display:flex; justify-content:space-between; align-items:flex-start; gap:20px;}
.service-card h3{font-size:18px; font-weight:400; margin:0 0 8px;}
.service-card p{color:var(--muted); font-size:13px; margin:0;}
.service-price{font-family:'Fraunces',serif; color:var(--gold-soft); font-size:19px; white-space:nowrap;}
.service-duration{display:block; font-size:11px; color:var(--muted); letter-spacing:.08em; margin-top:4px;}

.booking-wrap{display:grid; grid-template-columns:1fr 1fr; border-top:1px solid var(--line-soft);}
.booking-col{padding:48px 48px;}
.booking-col + .booking-col{border-left:1px solid var(--line-soft);}
.step-label{display:flex; align-items:center; gap:12px; margin-bottom:22px;}
.step-num{font-family:'Fraunces',serif; color:var(--gold); font-size:14px; border:1px solid var(--gold-dark); border-radius:50%; width:26px; height:26px; display:flex; align-items:center; justify-content:center;}
.service-pick{display:flex; flex-direction:column; gap:10px; margin-bottom:36px;}
.pick-row{display:flex; justify-content:space-between; align-items:center; padding:14px 18px; border:1px solid var(--line); cursor:pointer; font-size:14px;}
.pick-row.selected{border-color:var(--gold); background:rgba(198,161,91,0.08); color:var(--gold-soft);}
.pick-row span:last-child{color:var(--muted); font-size:12px;}
.pick-row.selected span:last-child{color:var(--gold);}

.day-strip{display:flex; gap:8px; margin-bottom:24px; flex-wrap:wrap;}
.day-chip{width:56px; padding:10px 0; text-align:center; border:1px solid var(--line); font-size:12px; cursor:pointer;}
.day-chip .d{display:block; color:var(--muted); font-size:10px; letter-spacing:.08em; text-transform:uppercase; margin-bottom:4px;}
.day-chip.selected{border-color:var(--gold); background:rgba(198,161,91,0.08); color:var(--gold-soft);}
.day-chip.disabled{opacity:.3; text-decoration:line-through; cursor:not-allowed;}

.slot-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:36px;}
.slot{padding:11px 0; text-align:center; font-size:13px; border:1px solid var(--line); cursor:pointer;}
.slot.selected{border-color:var(--gold); background:var(--gold); color:var(--bg-deep);}
.slot.taken{border-color:var(--line-soft); color:var(--muted); opacity:.35; text-decoration:line-through; cursor:not-allowed;}

.field{margin-bottom:20px;}
.field label{display:block; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:8px;}
.field input{width:100%; background:transparent; border:none; border-bottom:1px solid var(--line); color:var(--cream); font-family:'Jost',sans-serif; font-size:15px; padding:8px 2px;}
.field input:focus{outline:none; border-bottom-color:var(--gold);}
.summary-card{margin-top:28px; padding:22px; border:1px solid var(--line); background:var(--bg-card);}
.summary-card .row{display:flex; justify-content:space-between; font-size:13px; padding:6px 0; color:var(--muted);}
.summary-card .row span:last-child{color:var(--cream);}
.summary-card .total{border-top:1px solid var(--line-soft); margin-top:6px; padding-top:12px; font-family:'Fraunces',serif; font-size:17px; color:var(--gold-soft);}

.msg{padding:14px 18px; font-size:13px; margin-bottom:20px; border:1px solid; display:none;}
.msg.show{display:block;}
.msg.error{border-color:var(--danger); color:var(--danger);}
.msg.success{border-color:var(--gold); color:var(--gold-soft);}

.panel-shell{display:grid; grid-template-columns:220px 1fr; min-height:600px;}
.panel-side{border-right:1px solid var(--line-soft); padding:36px 0;}
.panel-side .p-item{padding:14px 32px; font-size:13px; color:var(--muted); cursor:pointer; border-left:2px solid transparent;}
.panel-side .p-item.active{color:var(--gold-soft); border-left:2px solid var(--gold); background:rgba(198,161,91,0.06);}
.panel-main{padding:40px 44px;}
.panel-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:28px;}
.panel-top h2{font-size:22px; font-weight:400; margin:0;}
.day-nav{display:flex; align-items:center; gap:18px; color:var(--muted); font-size:13px;}
.day-nav .arrow{cursor:pointer; color:var(--gold); background:none; border:none; font-size:16px; font-family:inherit;}

.agenda{border-top:1px solid var(--line-soft);}
.agenda-row{display:grid; grid-template-columns:80px 1fr 140px 100px; align-items:center; padding:16px 0; border-bottom:1px solid var(--line-soft); font-size:14px;}
.agenda-row .time{color:var(--gold); font-family:'Fraunces',serif; font-size:15px;}
.agenda-row .client{color:var(--cream);}
.agenda-row .service{color:var(--muted); font-size:12px;}
.status-tag{font-size:10px; letter-spacing:.08em; text-transform:uppercase; padding:5px 10px; text-align:center; width:fit-content;}
.status-tag.reservado{border:1px solid var(--gold-dark); color:var(--gold-soft);}
.status-tag.bloqueado{border:1px solid var(--muted); color:var(--muted);}
.row-actions{color:var(--muted); font-size:12px; text-align:right; cursor:pointer; background:none; border:none; font-family:inherit;}
.row-actions:hover{color:var(--danger);}

.login-wrap{max-width:360px; margin:100px auto; padding:0 24px;}
.login-wrap h2{margin-bottom:30px;}

.price-row{display:flex; justify-content:space-between; align-items:center; padding:14px 0; border-bottom:1px solid var(--line-soft); gap:16px;}
.price-row input{width:110px; background:var(--bg-card); border:1px solid var(--line); color:var(--cream); padding:8px 10px; font-family:'Jost',sans-serif;}

</style>
</head>
<body>

<div class="site-header">
  <div class="brand">Gastón <span>Lucero</span></div>
  <div class="site-nav"><span>Panel privado</span></div>
  <button class="btn" id="logoutBtn" style="display:none;">Cerrar sesión</button>
</div>

<!-- Formulario de login -->
<div class="login-wrap" id="loginWrap">
  <h2>Ingresá a tu panel</h2>
  <div class="msg" id="loginMsg"></div>
  <div class="field"><label>Email</label><input type="email" id="loginEmail"></div>
  <div class="field"><label>Contraseña</label><input type="password" id="loginPassword"></div>
  <button class="btn solid" id="loginBtn" style="width:100%; padding:14px 0; margin-top:10px;">Entrar</button>
</div>

<!-- Panel (oculto hasta loguearse) -->
<div class="panel-shell" id="panelShell" style="display:none;">
  <div class="panel-side">
    <div class="p-item active" data-tab="agenda">Agenda del día</div>
    <div class="p-item" data-tab="precios">Servicios y precios</div>
  </div>
  <div class="panel-main">

    <div id="tabAgenda">
      <div class="panel-top">
        <h2 id="fechaTitulo">—</h2>
        <div class="day-nav">
          <button class="arrow" id="diaAnterior">‹</button>
          <span id="diaHoyLabel">Hoy</span>
          <button class="arrow" id="diaSiguiente">›</button>
        </div>
      </div>
      <div class="agenda" id="agendaList">
        <p style="color:var(--muted); padding:20px 0;">Cargando agenda...</p>
      </div>
      <div style="margin-top:24px; padding:20px; border:1px dashed var(--line);">
        <div class="eyebrow" style="margin-bottom:14px; display:block;">Bloquear un rango de horarios</div>
        <div style="display:flex; gap:14px; align-items:end; flex-wrap:wrap;">
          <div class="field" style="margin:0;"><label>Desde</label><input type="time" id="bloqueoDesde"></div>
          <div class="field" style="margin:0;"><label>Hasta</label><input type="time" id="bloqueoHasta"></div>
          <button class="btn" id="bloquearRangoBtn">Bloquear rango</button>
          <button class="btn" id="bloquearDiaBtn">Bloquear el día completo</button>
        </div>
        <p style="color:var(--muted); font-size:12px; margin-top:12px;">
          "Bloquear el día completo" toma el horario de atención habitual de ese día (por ejemplo 9 a 19hs) y lo bloquea entero de una sola vez.
        </p>
      </div>
    </div>

    <div id="tabPrecios" style="display:none;">
      <div class="panel-top"><h2>Servicios y precios</h2></div>
      <div id="preciosList"></div>
    </div>

  </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="assets/supabase-client.js"></script>
<script>
let diaActual = new Date();
diaActual.setHours(0,0,0,0);

const loginWrap = document.getElementById('loginWrap');
const panelShell = document.getElementById('panelShell');
const logoutBtn = document.getElementById('logoutBtn');

async function verificarSesion(){
  const { data: { session } } = await db.auth.getSession();
  if(session){
    mostrarPanel();
  } else {
    loginWrap.style.display = 'block';
    panelShell.style.display = 'none';
    logoutBtn.style.display = 'none';
  }
}

document.getElementById('loginBtn').addEventListener('click', async () => {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const msg = document.getElementById('loginMsg');

  const { error } = await db.auth.signInWithPassword({ email, password });
  if(error){
    msg.textContent = 'Email o contraseña incorrectos.';
    msg.className = 'msg show error';
    return;
  }
  mostrarPanel();
});

logoutBtn.addEventListener('click', async () => {
  await db.auth.signOut();
  location.reload();
});

function mostrarPanel(){
  loginWrap.style.display = 'none';
  panelShell.style.display = 'grid';
  logoutBtn.style.display = 'block';
  cargarAgenda();
}

// --- Navegación entre pestañas ---
document.querySelectorAll('.p-item').forEach(item => {
  item.addEventListener('click', () => {
    document.querySelectorAll('.p-item').forEach(i => i.classList.remove('active'));
    item.classList.add('active');
    const tab = item.dataset.tab;
    document.getElementById('tabAgenda').style.display = tab === 'agenda' ? 'block' : 'none';
    document.getElementById('tabPrecios').style.display = tab === 'precios' ? 'block' : 'none';
    if(tab === 'precios') cargarPrecios();
  });
});

// --- Agenda del día ---
document.getElementById('diaAnterior').addEventListener('click', () => {
  diaActual.setDate(diaActual.getDate() - 1);
  cargarAgenda();
});
document.getElementById('diaSiguiente').addEventListener('click', () => {
  diaActual.setDate(diaActual.getDate() + 1);
  cargarAgenda();
});

async function cargarAgenda(){
  const fechaStr = diaActual.toISOString().slice(0,10);
  document.getElementById('fechaTitulo').textContent = diaActual.toLocaleDateString('es-AR', { weekday:'long', day:'numeric', month:'long' });

  const hoy = new Date(); hoy.setHours(0,0,0,0);
  document.getElementById('diaHoyLabel').textContent = diaActual.getTime() === hoy.getTime() ? 'Hoy' : '';

  const lista = document.getElementById('agendaList');
  lista.innerHTML = '<p style="color:var(--muted); padding:20px 0;">Cargando...</p>';

  const { data, error } = await db
    .from('turnos')
    .select('id, hora, nombre_cliente, telefono_cliente, estado, duracion_minutos, servicios(nombre)')
    .eq('fecha', fechaStr)
    .neq('estado', 'cancelado')
    .order('hora');

  if(error){
    lista.innerHTML = '<p style="color:var(--danger); padding:20px 0;">No pudimos cargar la agenda.</p>';
    return;
  }

  if(!data.length){
    lista.innerHTML = '<p style="color:var(--muted); padding:20px 0;">No hay turnos este día.</p>';
    return;
  }

  function horaFin(hora, duracion){
    const [h,m] = hora.split(':').map(Number);
    const total = h*60 + m + (duracion || 30);
    return String(Math.floor(total/60)).padStart(2,'0') + ':' + String(total%60).padStart(2,'0');
  }

  lista.innerHTML = data.map(t => `
    <div class="agenda-row">
      <span class="time">${t.hora.slice(0,5)}${t.estado === 'bloqueado' ? ' – ' + horaFin(t.hora, t.duracion_minutos) : ''}</span>
      <div>
        <span class="client">${t.estado === 'bloqueado' ? 'Bloqueado por vos' : t.nombre_cliente}</span><br>
        <span class="service">${t.estado === 'bloqueado' ? 'Horario no disponible' : (t.servicios ? t.servicios.nombre : '')}${t.telefono_cliente ? ' · ' + t.telefono_cliente : ''}</span>
      </div>
      <span class="status-tag ${t.estado}">${t.estado === 'bloqueado' ? 'Bloqueado' : 'Reservado'}</span>
      <button class="row-actions" data-id="${t.id}">${t.estado === 'bloqueado' ? 'Desbloquear' : 'Cancelar'}</button>
    </div>
  `).join('');

  lista.querySelectorAll('.row-actions').forEach(btn => {
    btn.addEventListener('click', async () => {
      await db.from('turnos').update({ estado: 'cancelado' }).eq('id', btn.dataset.id);
      cargarAgenda();
    });
  });
}

document.getElementById('bloquearRangoBtn').addEventListener('click', async () => {
  const desde = document.getElementById('bloqueoDesde').value;
  const hasta = document.getElementById('bloqueoHasta').value;
  await bloquearRango(desde, hasta);
});

document.getElementById('bloquearDiaBtn').addEventListener('click', async () => {
  const diaSemana = diaActual.getDay();
  const { data } = await db.from('horarios_atencion').select('*').eq('dia_semana', diaSemana).maybeSingle();
  if (!data) {
    alert('No hay un horario de atención configurado para este día.');
    return;
  }
  await bloquearRango(data.hora_inicio.slice(0,5), data.hora_fin.slice(0,5));
});

async function bloquearRango(desde, hasta){
  if(!desde || !hasta){
    alert('Completá la hora de inicio y de fin.');
    return;
  }
  const [hD, mD] = desde.split(':').map(Number);
  const [hH, mH] = hasta.split(':').map(Number);
  const minutosDesde = hD*60 + mD;
  const minutosHasta = hH*60 + mH;
  if(minutosHasta <= minutosDesde){
    alert('La hora "Hasta" tiene que ser posterior a "Desde".');
    return;
  }
  const fechaStr = diaActual.toISOString().slice(0,10);
  await db.from('turnos').insert({
    fecha: fechaStr,
    hora: desde,
    estado: 'bloqueado',
    duracion_minutos: minutosHasta - minutosDesde
  });
  document.getElementById('bloqueoDesde').value = '';
  document.getElementById('bloqueoHasta').value = '';
  cargarAgenda();
}

// --- Servicios y precios ---
async function cargarPrecios(){
  const cont = document.getElementById('preciosList');
  cont.innerHTML = '<p style="color:var(--muted);">Cargando...</p>';

  const { data, error } = await db.from('servicios').select('*').order('nombre');
  if(error){
    cont.innerHTML = '<p style="color:var(--danger);">No pudimos cargar los servicios.</p>';
    return;
  }

  cont.innerHTML = data.map(s => `
    <div class="price-row">
      <span>${s.nombre} <span style="color:var(--muted); font-size:12px;">(${s.duracion_minutos} min)</span></span>
      <div style="display:flex; gap:10px; align-items:center;">
        <input type="number" value="${s.precio}" data-id="${s.id}" class="precioInput">
        <button class="btn guardarPrecioBtn" data-id="${s.id}">Guardar</button>
      </div>
    </div>
  `).join('');

  cont.querySelectorAll('.guardarPrecioBtn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const input = cont.querySelector(`.precioInput[data-id="${btn.dataset.id}"]`);
      const nuevoPrecio = Number(input.value);
      btn.textContent = 'Guardando...';
      await db.from('servicios').update({ precio: nuevoPrecio }).eq('id', btn.dataset.id);
      btn.textContent = 'Guardado ✓';
      setTimeout(() => btn.textContent = 'Guardar', 1500);
    });
  });
}

verificarSesion();
</script>

</body>
</html>
